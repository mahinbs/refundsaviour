services:
  - type: web
    name: refundsaviour
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: refundsaviour
          property: port

      # ── Fill these in Render dashboard → Environment ───────────────────
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: SESSION_SECRET
        sync: false
      - key: SUPER_ADMIN_SECRET
        sync: false

      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_PRICE_ID_STARTER
        sync: false
      - key: PADDLE_PRICE_ID_PRO
        sync: false
